<!DOCTYPE html>
<html lang="th" style="color-scheme: dark;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หุ่นยนต์ครูน้อย (Little Teacher Robot)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #12261a;
            --board-green: #1e3f2b;
            --board-light: #2a5a3d;
            --text-light: #f5f5dc;
            --accent-yellow: #f4d03f;
            --accent-red: #e74c3c;
            --accent-blue: #5dade2;
            --accent-mint: #1abc9c;
            --focus-ring: #ffffff;
            --font-head: 'Mali', cursive;
            --font-body: 'Sarabun', sans-serif;
            --grid-size: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3, h4, .btn-text {
            font-family: var(--font-head);
        }

        button, select {
            font-family: var(--font-body);
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 8px;
            background: var(--board-light);
            color: var(--text-light);
            padding: 8px 12px;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        button:focus-visible, select:focus-visible {
            outline: 3px solid var(--focus-ring);
            outline-offset: 2px;
        }

        button:hover:not(:disabled) {
            filter: brightness(1.2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        header {
            background-color: #0d1a12;
            padding: 10px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--board-light);
        }

        .level-selector {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .level-btn {
            background: var(--board-light);
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-head);
            font-weight: bold;
        }

        .level-btn.active {
            background: var(--accent-yellow);
            color: var(--bg-dark);
        }

        .level-btn.locked {
            background: transparent;
            border: 2px dashed var(--board-light);
            color: #777;
        }

        .main-content {
            display: flex;
            flex: 1;
            flex-direction: row;
            overflow: hidden;
        }

        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
                overflow: visible;
            }
        }

        .left-panel {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 2px solid var(--board-light);
            max-width: 100%;
        }

        .level-info {
            background: var(--board-green);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--accent-mint);
        }

        .concept-badge {
            display: inline-block;
            background: var(--accent-blue);
            color: var(--bg-dark);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .canvas-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            position: relative;
            background: var(--board-green);
            border: 4px solid var(--board-light);
            border-radius: 8px;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-primary { background: var(--accent-mint); color: var(--bg-dark); font-weight: bold; }
        .btn-danger { background: var(--accent-red); font-weight: bold; }
        .btn-warning { background: var(--accent-yellow); color: var(--bg-dark); font-weight: bold; }
        .btn-info { background: var(--accent-blue); color: var(--bg-dark); font-weight: bold; }

        .status-box {
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            min-height: 44px;
            background: var(--board-green);
        }

        .right-panel {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 100%;
            background: #0f2117;
        }

        .palette {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--board-green);
            padding: 15px;
            border-radius: 8px;
        }

        .block-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            color: var(--bg-dark);
            border: none;
        }

        .block-action { background: var(--accent-mint); }
        .block-loop { background: var(--accent-yellow); }
        .block-cond { background: var(--accent-blue); }

        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .workspace {
            flex: 1;
            background: var(--board-green);
            border: 2px dashed var(--board-light);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .block-node {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .block-node.active-highlight {
            border-color: var(--accent-red);
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }

        .block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .block-children {
            margin-left: 20px;
            padding-left: 10px;
            border-left: 2px solid var(--board-light);
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 20px;
        }

        .btn-insert {
            background: transparent;
            border: 1px dashed var(--accent-mint);
            color: var(--accent-mint);
            font-size: 0.8rem;
            padding: 4px 8px;
        }

        .btn-insert.is-target {
            background: var(--accent-mint);
            color: var(--bg-dark);
            border-style: solid;
        }

        .btn-delete {
            background: transparent;
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            padding: 2px 6px;
            font-size: 0.8rem;
        }

        .teacher-corner {
            background: #0a140e;
            border-top: 2px solid var(--accent-yellow);
            padding: 0;
        }

        .teacher-header {
            width: 100%;
            background: transparent;
            color: var(--accent-yellow);
            text-align: left;
            padding: 15px 20px;
            font-size: 1.2rem;
            border: none;
            display: flex;
            justify-content: space-between;
        }

        .teacher-content {
            padding: 0 20px 20px 20px;
            display: none;
        }

        .teacher-content.open {
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>หุ่นยนต์ครูน้อย</h1>
            <div style="color: var(--accent-yellow); font-weight: bold;" id="total-stars-display">ดาวรวม: 0/18</div>
        </div>
        <div class="level-selector" id="level-selector">
            <!-- Level buttons generated by JS -->
        </div>
    </header>

    <main class="main-content">
        <section class="left-panel">
            <div class="level-info">
                <div class="concept-badge" id="level-concept">Concept</div>
                <h2 id="level-title">ชื่อด่าน</h2>
                <p id="level-desc">รายละเอียดภารกิจ</p>
            </div>
            
            <div class="canvas-container">
                <canvas id="gameCanvas" width="600" height="600"></canvas>
            </div>

            <div class="controls">
                <button class="btn-primary" id="btn-start">เริ่มทำงาน</button>
                <button class="btn-warning" id="btn-reset">ตั้งค่าใหม่</button>
                <button class="btn-info" id="btn-solution">ดูแนวทาง</button>
                <select id="speed-select" aria-label="เลือกความเร็ว">
                    <option value="1">ความเร็ว 1x</option>
                    <option value="2">ความเร็ว 2x</option>
                    <option value="4">ความเร็ว 4x</option>
                </select>
            </div>

            <div class="status-box" id="status-box">รอคำสั่ง...</div>
        </section>

        <section class="right-panel">
            <div class="palette" id="block-palette">
                <button class="block-btn block-action" onclick="addBlock('F')">เดินหน้า</button>
                <button class="block-btn block-action" onclick="addBlock('L')">เลี้ยวซ้าย</button>
                <button class="block-btn block-action" onclick="addBlock('R')">เลี้ยวขวา</button>
                <div style="display:flex; gap:5px; align-items:center;">
                    <button class="block-btn block-loop" onclick="addBlock('LOOP')">วนซ้ำ</button>
                    <select id="loop-count" aria-label="จำนวนรอบ" style="color:black; padding:4px;">
                        <option value="2">2</option><option value="3">3</option>
                        <option value="4">4</option><option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                </div>
                <button class="block-btn block-loop" id="btn-while" onclick="addBlock('WHILE')" style="display:none;">วนจนถึงธง</button>
                <button class="block-btn block-cond" id="btn-if" onclick="addBlock('IF')" style="display:none;">ถ้าชนกำแพง</button>
            </div>

            <div class="workspace-header">
                <h3>โปรแกรม</h3>
                <div>
                    <span id="block-count-display">ใช้ 0 บล็อก</span>
                    <span style="margin-left: 10px; color: var(--accent-yellow);" id="par-display">(3 ดาว: 0)</span>
                </div>
            </div>

            <div class="workspace" id="workspace">
                <!-- Blocks rendered here -->
            </div>
            
            <div style="text-align: right;">
                <button class="btn-danger" id="btn-clear">ล้างโปรแกรม</button>
            </div>
        </section>
    </main>

    <footer class="teacher-corner">
        <button class="teacher-header" id="btn-teacher" aria-expanded="false">
            <span class="btn-text">มุมครู (Teacher's Corner)</span>
            <span id="teacher-icon">▼</span>
        </button>
        <div class="teacher-content" id="teacher-content">
            <h4 style="color: var(--accent-blue); margin-bottom: 10px;">แนวคิดการสอน</h4>
            <p id="teacher-concept-text" style="margin-bottom: 10px;"></p>
            <h4 style="color: var(--accent-mint); margin-bottom: 10px;">คำถามชวนอภิปราย</h4>
            <p id="teacher-question-text"></p>
        </div>
    </footer>

    <script>
        // --- Data ---
        // Maps definition:
        // S = Start, G = Goal, * = Star, # = Wall, . = Empty
        const levelData = [
            {
                id: 1, concept: "ลำดับขั้นตอน", name: "ก้าวแรก", desc: "วางบล็อกคำสั่งให้หุ่นยนต์เดินไปที่ธงตามลำดับที่ถูกต้อง",
                par: 3, S_dir: 1, // 0=N, 1=E, 2=S, 3=W
                map: [
                    "......",
                    "......",
                    "......",
                    "......",
                    "......",
                    "S..G.."
                ],
                solution: [{type:'F'}, {type:'F'}, {type:'F'}],
                teacher: {
                    concept: "ด่านนี้สอนเรื่อง Sequence (ลำดับขั้นตอน) ผู้เรียนจะเห็นว่าคำสั่งถูกทำตามลำดับจากบนลงล่าง การเรียงลำดับผิดจะทำให้ได้ผลลัพธ์ที่ผิดพลาด",
                    question: "ถ้านักเรียนสลับลำดับของคำสั่งเดินหน้ากับการเลี้ยว (ในชีวิตจริง) ผลลัพธ์จะเปลี่ยนไปอย่างไร? การจัดลำดับสำคัญอย่างไรในการแก้ปัญหา?"
                }
            },
            {
                id: 2, concept: "ลำดับขั้นตอน", name: "เลี้ยวซ้ายขวา", desc: "หุ่นยนต์หันหน้าไปทางด้านบน (ทิศเหนือ) วางแผนการเลี้ยวและเดินหน้าให้ดี",
                par: 7, S_dir: 0,
                map: [
                    "......",
                    "......",
                    "...G..",
                    "......",
                    "......",
                    "S....."
                ],
                solution: [{type:'F'},{type:'F'},{type:'F'},{type:'R'},{type:'F'},{type:'F'},{type:'F'}],
                teacher: {
                    concept: "ต่อยอดเรื่องลำดับขั้นตอนโดยเพิ่มทิศทางสัมพันธ์ (ซ้าย/ขวา ของตัวหุ่นยนต์ ไม่ใช่ของหน้าจอ) เป็นการฝึก Spatial Thinking",
                    question: "คำว่า 'ซ้าย' ของหุ่นยนต์ เหมือนกับ 'ซ้าย' ของเราที่มองจอหรือไม่? การเอาใจเขามาใส่ใจเรา (Perspective taking) เกี่ยวกับการเขียนโปรแกรมอย่างไร?"
                }
            },
            {
                id: 3, concept: "การวนซ้ำ", name: "ขั้นบันได", desc: "มองหารูปแบบที่ซ้ำกัน แล้วใช้บล็อก 'วนซ้ำ' เพื่อลดจำนวนบล็อก",
                par: 6, S_dir: 1,
                map: [
                    "......",
                    "......",
                    "....G.",
                    "......",
                    "......",
                    "S....."
                ],
                solution: [
                    {type:'F'},
                    {type:'LOOP', count:3, children: [
                        {type:'L'}, {type:'F'}, {type:'R'}, {type:'F'}
                    ]}
                ],
                teacher: {
                    concept: "เชื่อมโยงกับ Pattern Recognition (การรู้จำรูปแบบ) เมื่อเห็นชุดคำสั่งที่ต้องทำซ้ำๆ การใช้ Loop จะทำให้โปรแกรมสั้นลงและจัดการง่ายขึ้น",
                    question: "ในด่านนี้มีรูปแบบอะไรที่เกิดขึ้นซ้ำ? ถ้าระยะทางไกลกว่านี้ 100 เท่า การใช้การวนซ้ำจะมีประโยชน์กว่าการเขียนคำสั่งเรียงกันอย่างไร?"
                }
            },
            {
                id: 4, concept: "การวนซ้ำ", name: "เก็บดาว", desc: "ต้องเก็บดาวให้ครบก่อนถึงธง หาวิธีเดินเป็นรอบสี่เหลี่ยมเพื่อความคุ้มค่า",
                par: 7, S_dir: 1,
                map: [
                    "S..*..",
                    "G.....",
                    "......",
                    "*..*..",
                    "......",
                    "......"
                ],
                solution: [
                    {type:'LOOP', count:3, children: [
                        {type:'F'}, {type:'F'}, {type:'F'}, {type:'R'}
                    ]},
                    {type:'F'}, {type:'F'}
                ],
                teacher: {
                    concept: "ฝึกการใช้ Loop ร่วมกับคำสั่งที่อยู่นอก Loop ผู้เรียนต้องคิดว่าจะวนซ้ำถึงจุดไหน และจุดไหนต้องเขียนคำสั่งแยก",
                    question: "ดาวถูกวางไว้ในรูปแบบใด? เราสามารถเปลี่ยนจุดเริ่มต้นของการวนซ้ำเพื่อแก้ปัญหาด้วยวิธีอื่นที่ใช้จำนวนบล็อกเท่ากันได้หรือไม่?"
                }
            },
            {
                id: 5, concept: "เงื่อนไข", name: "ทางตัน", desc: "กำแพงกั้นทาง! ใช้ 'วนจนถึงธง' และ 'ถ้าชนกำแพง' (ขอบแผนที่นับเป็นกำแพง)",
                par: 4, S_dir: 0,
                map: [
                    "......",
                    ".####.",
                    ".####.",
                    ".####.",
                    ".####.",
                    "S##G.."
                ],
                solution: [
                    {type:'WHILE', children: [
                        {type:'IF', children: [{type:'R'}]},
                        {type:'F'}
                    ]}
                ],
                teacher: {
                    concept: "แนะนำ Condition (เงื่อนไข) หุ่นยนต์สามารถตัดสินใจเองได้จากสภาพแวดล้อม (ชนกำแพง) ทำให้โปรแกรมมีความยืดหยุ่น ยอมรับความไม่แน่นอนได้",
                    question: "โปรแกรมเดียวกันนี้ ถ้านำไปใช้ในแผนที่ที่มีขนาดใหญ่ขึ้นหรือกำแพงยาวขึ้น หุ่นยนต์จะยังเดินถึงเป้าหมายหรือไม่? เพราะเหตุใด?"
                }
            },
            {
                id: 6, concept: "ลูปซ้อนลูป", name: "ทางงู", desc: "นำทุกอย่างมารวมกัน สร้างลูปซ้อนลูปเพื่อเก็บดาวและไปให้ถึงธง",
                par: 11, S_dir: 1,
                map: [
                    "S....*",
                    "*.....",
                    ".....*",
                    "*.....",
                    "G.....",
                    "......"
                ],
                solution: [
                    {type:'LOOP', count:2, children: [
                        {type:'LOOP', count:5, children:[{type:'F'}]},
                        {type:'R'}, {type:'F'}, {type:'R'},
                        {type:'LOOP', count:5, children:[{type:'F'}]},
                        {type:'L'}, {type:'F'}, {type:'L'}
                    ]}
                ],
                teacher: {
                    concept: "ขั้นสูงสุดคือ Nested Loop (ลูปซ้อนลูป) การแบ่งปัญหาใหญ่เป็นปัญหาย่อย (Decomposition) มองทางเดินไปกลับเป็น 1 รอบใหญ่ ที่ข้างในมีการเดินตรงยาว 2 รอบย่อย",
                    question: "การใช้ลูปซ้อนลูปทำให้โปรแกรมสั้นลงมาก แต่อ่านเข้าใจยากขึ้นหรือไม่? ในฐานะผู้พัฒนา เราควรสร้างสมดุลระหว่างความสั้นกระชับกับความอ่านง่ายอย่างไร?"
                }
            }
        ];

        // --- State ---
        let currentLevelIndex = 0;
        let starsRecord = {};
        let program = []; // AST Root
        let insertTarget = program; // Where new blocks go
        let nextBlockId = 1;
        let isAnimating = false;
        let animationFrameId;
        
        let board = { w: 6, h: 6, S: null, G: null, stars: [], walls: [] };
        let botState = { x: 0, y: 0, dir: 1, stars: 0 };
        
        // --- Initialization ---
        function init() {
            loadProgress();
            renderLevelSelector();
            loadLevel(0);
            
            // Events
            document.getElementById('btn-start').addEventListener('click', runProgram);
            document.getElementById('btn-reset').addEventListener('click', resetBoard);
            document.getElementById('btn-clear').addEventListener('click', clearProgram);
            document.getElementById('btn-solution').addEventListener('click', loadSolution);
            document.getElementById('btn-teacher').addEventListener('click', toggleTeacher);
            
            // Canvas resize
            window.addEventListener('resize', draw);
        }

        function loadProgress() {
            try {
                const data = localStorage.getItem('ct_robot_stars');
                if (data) starsRecord = JSON.parse(data);
            } catch (e) {
                console.warn("Could not access localStorage", e);
            }
            updateTotalStars();
        }

        function saveProgress() {
            try {
                localStorage.setItem('ct_robot_stars', JSON.stringify(starsRecord));
            } catch (e) {}
        }

        function updateTotalStars() {
            let total = 0;
            for (let i = 1; i <= 6; i++) {
                total += (starsRecord[i] || 0);
            }
            document.getElementById('total-stars-display').innerText = `ดาวรวม: ${total}/18`;
        }

        function renderLevelSelector() {
            const container = document.getElementById('level-selector');
            container.innerHTML = '';
            for (let i = 0; i < levelData.length; i++) {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                
                // Logic for unlock: level 1 is open, others need prev level >= 1 star
                let isLocked = i > 0 && !(starsRecord[levelData[i-1].id] >= 1);
                
                if (isLocked) {
                    btn.classList.add('locked');
                    btn.innerText = '🔒';
                    btn.disabled = true;
                } else {
                    btn.innerText = i + 1;
                    let stars = starsRecord[levelData[i].id] || 0;
                    if(stars > 0) btn.innerHTML += `<br><span style="font-size:0.5rem; color:var(--accent-yellow)">${'★'.repeat(stars)}</span>`;
                    btn.onclick = () => loadLevel(i);
                }
                
                if (i === currentLevelIndex) btn.classList.add('active');
                container.appendChild(btn);
            }
        }

        function parseMap(mapStrs) {
            board.stars = [];
            board.walls = [];
            for (let y = 0; y < 6; y++) {
                for (let x = 0; x < 6; x++) {
                    const char = mapStrs[y][x];
                    if (char === 'S') board.S = {x, y};
                    else if (char === 'G') board.G = {x, y};
                    else if (char === '*') board.stars.push({x, y, collected: false});
                    else if (char === '#') board.walls.push({x, y});
                }
            }
        }

        function loadLevel(index) {
            if (isAnimating) stopAnimation();
            currentLevelIndex = index;
            const lvl = levelData[index];
            
            document.getElementById('level-concept').innerText = lvl.concept;
            document.getElementById('level-title').innerText = `ด่าน ${lvl.id}: ${lvl.name}`;
            document.getElementById('level-desc').innerText = lvl.desc;
            document.getElementById('par-display').innerText = `(3 ดาว: ไม่เกิน ${lvl.par})`;
            
            document.getElementById('teacher-concept-text').innerText = lvl.teacher.concept;
            document.getElementById('teacher-question-text').innerText = lvl.teacher.question;
            
            // Unlocks
            document.getElementById('btn-while').style.display = lvl.id >= 5 ? 'block' : 'none';
            document.getElementById('btn-if').style.display = lvl.id >= 5 ? 'block' : 'none';

            parseMap(lvl.map);
            clearProgram();
            resetBoard();
            renderLevelSelector();
            setStatus("รอคำสั่ง...", "var(--board-green)");
        }

        function resetBoard() {
            if (isAnimating) stopAnimation();
            const lvl = levelData[currentLevelIndex];
            botState = { x: board.S.x, y: board.S.y, dir: lvl.S_dir, stars: 0 };
            board.stars.forEach(s => s.collected = false);
            
            // clear highlights
            document.querySelectorAll('.block-node').forEach(el => el.classList.remove('active-highlight'));
            draw();
            setStatus("รอคำสั่ง...", "var(--board-green)");
        }

        function deepCopyProgram(prog) {
            return JSON.parse(JSON.stringify(prog));
        }

        function clearProgram() {
            program = [];
            insertTarget = program;
            nextBlockId = 1;
            renderWorkspace();
        }

        function loadSolution() {
            if (isAnimating) stopAnimation();
            program = deepCopyProgram(levelData[currentLevelIndex].solution);
            assignIds(program);
            insertTarget = program;
            renderWorkspace();
            resetBoard();
        }

        function assignIds(prog) {
            for (let b of prog) {
                b.id = nextBlockId++;
                if (b.children) assignIds(b.children);
            }
        }

        function addBlock(type) {
            let newBlock = { id: nextBlockId++, type: type };
            if (type === 'LOOP') {
                newBlock.count = parseInt(document.getElementById('loop-count').value);
                newBlock.children = [];
            } else if (type === 'WHILE' || type === 'IF') {
                newBlock.children = [];
            }
            insertTarget.push(newBlock);
            renderWorkspace();
        }

        function deleteBlock(id, currentList) {
            for (let i = 0; i < currentList.length; i++) {
                if (currentList[i].id === id) {
                    // if insertTarget is inside the deleted block, reset it
                    if (isTargetInside(currentList[i], insertTarget)) {
                        insertTarget = program;
                    }
                    currentList.splice(i, 1);
                    return true;
                }
                if (currentList[i].children) {
                    if (deleteBlock(id, currentList[i].children)) return true;
                }
            }
            return false;
        }

        function isTargetInside(block, targetList) {
            if (!block.children) return false;
            if (block.children === targetList) return true;
            for (let child of block.children) {
                if (isTargetInside(child, targetList)) return true;
            }
            return false;
        }

        function countBlocks(prog) {
            let count = 0;
            for (let b of prog) {
                count++;
                if (b.children) count += countBlocks(b.children);
            }
            return count;
        }

        function renderWorkspace() {
            const ws = document.getElementById('workspace');
            ws.innerHTML = '';
            
            if (program.length === 0) {
                ws.innerHTML = '<div style="color: #888; text-align:center; padding:20px;">เพิ่มบล็อกคำสั่งจากเมนูด้านบน</div>';
            } else {
                ws.appendChild(renderList(program, true));
            }

            // Root insert button if target is root
            const rootInsertBtn = document.createElement('button');
            rootInsertBtn.className = 'btn-insert ' + (insertTarget === program ? 'is-target' : '');
            rootInsertBtn.innerText = insertTarget === program ? '📍 ใส่ต่อท้ายที่นี่' : 'ใส่ต่อท้ายโปรแกรมหลัก';
            rootInsertBtn.onclick = () => { insertTarget = program; renderWorkspace(); };
            rootInsertBtn.style.marginTop = '10px';
            ws.appendChild(rootInsertBtn);

            const count = countBlocks(program);
            document.getElementById('block-count-display').innerText = `ใช้ ${count} บล็อก`;
        }

        function renderList(list, isRoot) {
            const container = document.createElement('div');
            container.style.display = 'flex';
            container.style.flexDirection = 'column';
            container.style.gap = '5px';

            for (let block of list) {
                const node = document.createElement('div');
                node.className = 'block-node';
                node.id = 'block-' + block.id;
                
                const header = document.createElement('div');
                header.className = 'block-header';
                
                let title = '';
                if (block.type === 'F') title = '🚶 เดินหน้า';
                else if (block.type === 'L') title = '↩️ เลี้ยวซ้าย';
                else if (block.type === 'R') title = '↪️ เลี้ยวขวา';
                else if (block.type === 'LOOP') title = `🔁 วนซ้ำ ${block.count} รอบ`;
                else if (block.type === 'WHILE') title = `🏁 วนจนกว่าจะถึงธง`;
                else if (block.type === 'IF') title = `🧱 ถ้าข้างหน้าเป็นกำแพง`;
                
                const titleSpan = document.createElement('span');
                titleSpan.innerText = title;
                titleSpan.style.fontWeight = 'bold';
                
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-delete';
                delBtn.innerText = 'ลบ';
                delBtn.onclick = () => {
                    deleteBlock(block.id, program);
                    renderWorkspace();
                };

                header.appendChild(titleSpan);
                header.appendChild(delBtn);
                node.appendChild(header);

                if (block.children) {
                    const childrenDiv = document.createElement('div');
                    childrenDiv.className = 'block-children';
                    childrenDiv.appendChild(renderList(block.children, false));
                    
                    const insertBtn = document.createElement('button');
                    insertBtn.className = 'btn-insert ' + (insertTarget === block.children ? 'is-target' : '');
                    insertBtn.innerText = insertTarget === block.children ? '📍 ใส่ในนี้' : 'ใส่ในนี้';
                    insertBtn.onclick = () => { insertTarget = block.children; renderWorkspace(); };
                    
                    childrenDiv.appendChild(insertBtn);
                    node.appendChild(childrenDiv);
                }
                
                container.appendChild(node);
            }
            return container;
        }

        const DIRS = [
            {dx: 0, dy: -1}, // 0: N
            {dx: 1, dy: 0},  // 1: E
            {dx: 0, dy: 1},  // 2: S
            {dx: -1, dy: 0}  // 3: W
        ];

        function isWallOrEdge(x, y) {
            if (x < 0 || x >= 6 || y < 0 || y >= 6) return true;
            for (let w of board.walls) {
                if (w.x === x && w.y === y) return true;
            }
            return false;
        }

        function runProgram() {
            if (isAnimating) return;
            if (program.length === 0) return;
            resetBoard();
            
            let simulation = {
                path: [], // array of states
                status: 'success',
                msg: ''
            };
            
            // Clone state for simulation
            let simState = { 
                x: botState.x, y: botState.y, dir: botState.dir, 
                stars: JSON.parse(JSON.stringify(board.stars)),
                steps: 0, whileCount: 0 
            };
            
            // Push initial state
            simulation.path.push(cloneState(simState, null));

            // Execute AST recursively
            function execAst(list) {
                for (let block of list) {
                    if (simulation.status !== 'success') return;
                    if (simState.steps > 900) {
                        simulation.status = 'limit'; simulation.msg = 'ทำงานเกิน 900 ขั้นตอน!'; return;
                    }

                    if (block.type === 'F') {
                        let nx = simState.x + DIRS[simState.dir].dx;
                        let ny = simState.y + DIRS[simState.dir].dy;
                        
                        if (isWallOrEdge(nx, ny)) {
                            simulation.status = 'crash';
                            simulation.msg = 'ชนกำแพงหรือตกขอบแผนที่!';
                            simState.steps++;
                            simulation.path.push(cloneState(simState, block.id, true)); // error frame
                            return;
                        }
                        
                        simState.x = nx; simState.y = ny;
                        // check star
                        for (let s of simState.stars) {
                            if (!s.collected && s.x === nx && s.y === ny) {
                                s.collected = true;
                            }
                        }
                        simState.steps++;
                        simulation.path.push(cloneState(simState, block.id));
                    } 
                    else if (block.type === 'L') {
                        simState.dir = (simState.dir + 3) % 4;
                        simState.steps++;
                        simulation.path.push(cloneState(simState, block.id));
                    }
                    else if (block.type === 'R') {
                        simState.dir = (simState.dir + 1) % 4;
                        simState.steps++;
                        simulation.path.push(cloneState(simState, block.id));
                    }
                    else if (block.type === 'LOOP') {
                        for (let i = 0; i < block.count; i++) {
                            if (simulation.status !== 'success') break;
                            execAst(block.children);
                        }
                    }
                    else if (block.type === 'WHILE') {
                        let loopSafe = 0;
                        while (simState.x !== board.G.x || simState.y !== board.G.y) {
                            if (simulation.status !== 'success') break;
                            if (loopSafe++ > 60) {
                                simulation.status = 'limit'; simulation.msg = 'วนซ้ำนานเกินไป (เกิน 60 รอบ)!'; return;
                            }
                            execAst(block.children);
                        }
                    }
                    else if (block.type === 'IF') {
                        let frontX = simState.x + DIRS[simState.dir].dx;
                        let frontY = simState.y + DIRS[simState.dir].dy;
                        
                        // Condition highlight frame
                        simState.steps++;
                        simulation.path.push(cloneState(simState, block.id));

                        if (isWallOrEdge(frontX, frontY)) {
                            execAst(block.children);
                        }
                    }
                }
            }

            execAst(program);
            
            // Check win conditions if not failed during execution
            if (simulation.status === 'success') {
                if (simState.x === board.G.x && simState.y === board.G.y) {
                    let allStars = simState.stars.every(s => s.collected);
                    if (board.stars.length > 0 && !allStars) {
                        simulation.status = 'incomplete';
                        simulation.msg = 'ถึงธงแล้ว แต่เก็บดาวไม่ครบ!';
                    } else {
                        simulation.status = 'win';
                    }
                } else {
                    simulation.status = 'incomplete';
                    simulation.msg = 'โปรแกรมจบแล้ว แต่ยังไม่ถึงธง!';
                }
            }

            playAnimation(simulation);
        }

        function cloneState(st, activeId, isCrash=false) {
            return {
                x: st.x, y: st.y, dir: st.dir,
                stars: JSON.parse(JSON.stringify(st.stars)),
                activeId: activeId,
                isCrash: isCrash
            };
        }

        function playAnimation(sim) {
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            
            if (prefersReducedMotion || sim.path.length <= 1) {
                // Jump to end
                applyStateToUI(sim.path[sim.path.length - 1]);
                showResult(sim);
                return;
            }

            isAnimating = true;
            document.getElementById('btn-start').disabled = true;
            let frameIdx = 0;
            
            function nextFrame() {
                if (!isAnimating) return; // stopped by reset
                
                let speedFactor = parseInt(document.getElementById('speed-select').value);
                let delay = 500 / speedFactor; // ms per block

                applyStateToUI(sim.path[frameIdx]);
                
                frameIdx++;
                if (frameIdx < sim.path.length) {
                    setTimeout(nextFrame, delay);
                } else {
                    isAnimating = false;
                    document.getElementById('btn-start').disabled = false;
                    showResult(sim);
                    document.querySelectorAll('.block-node').forEach(el => el.classList.remove('active-highlight'));
                }
            }
            
            nextFrame();
        }

        function stopAnimation() {
            isAnimating = false;
            document.getElementById('btn-start').disabled = false;
        }

        function applyStateToUI(state) {
            if (!state) return;
            botState.x = state.x;
            botState.y = state.y;
            botState.dir = state.dir;
            
            for(let i=0; i<board.stars.length; i++) {
                board.stars[i].collected = state.stars[i].collected;
            }
            
            document.querySelectorAll('.block-node').forEach(el => el.classList.remove('active-highlight'));
            if (state.activeId) {
                let node = document.getElementById('block-' + state.activeId);
                if (node) {
                    node.classList.add('active-highlight');
                    node.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
            
            draw(state.isCrash);
        }

        function setStatus(msg, bg) {
            const box = document.getElementById('status-box');
            box.innerText = msg;
            box.style.background = bg;
        }

        function showResult(sim) {
            if (sim.status === 'win') {
                let blocksUsed = countBlocks(program);
                let par = levelData[currentLevelIndex].par;
                let starsEarned = 1;
                if (blocksUsed <= par) starsEarned = 3;
                else if (blocksUsed <= par + 3) starsEarned = 2;
                
                setStatus(`🎉 สำเร็จ! ได้ ${starsEarned} ดาว (ใช้ ${blocksUsed} บล็อก)`, 'var(--board-light)');
                
                // save
                let lvlId = levelData[currentLevelIndex].id;
                if (!starsRecord[lvlId] || starsRecord[lvlId] < starsEarned) {
                    starsRecord[lvlId] = starsEarned;
                    saveProgress();
                    updateTotalStars();
                    renderLevelSelector();
                }
            } else {
                setStatus(`❌ ไม่สำเร็จ: ${sim.msg}`, 'var(--accent-red)');
            }
        }

        function draw(isCrash = false) {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const cw = canvas.width;
            const ch = canvas.height;
            const size = cw / 6;

            ctx.clearRect(0, 0, cw, ch);

            // Draw grid
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 2;
            for (let i = 0; i <= 6; i++) {
                ctx.beginPath(); ctx.moveTo(i * size, 0); ctx.lineTo(i * size, ch); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * size); ctx.lineTo(cw, i * size); ctx.stroke();
            }

            // Draw walls (chalk hash pattern)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            for (let w of board.walls) {
                ctx.fillRect(w.x * size + 2, w.y * size + 2, size - 4, size - 4);
                // X pattern
                ctx.beginPath();
                ctx.moveTo(w.x * size + 5, w.y * size + 5);
                ctx.lineTo((w.x + 1) * size - 5, (w.y + 1) * size - 5);
                ctx.moveTo((w.x + 1) * size - 5, w.y * size + 5);
                ctx.lineTo(w.x * size + 5, (w.y + 1) * size - 5);
                ctx.stroke();
            }

            // Draw Goal (Flag)
            if (board.G) {
                let gx = board.G.x * size;
                let gy = board.G.y * size;
                ctx.fillStyle = '#bdc3c7'; // pole
                ctx.fillRect(gx + size*0.2, gy + size*0.1, size*0.1, size*0.8);
                ctx.fillStyle = varColor('--accent-red'); // flag
                ctx.beginPath();
                ctx.moveTo(gx + size*0.3, gy + size*0.1);
                ctx.lineTo(gx + size*0.8, gy + size*0.3);
                ctx.lineTo(gx + size*0.3, gy + size*0.5);
                ctx.fill();
            }

            // Draw Stars
            for (let s of board.stars) {
                if (!s.collected) {
                    drawStar(ctx, s.x * size + size/2, s.y * size + size/2, 5, size*0.3, size*0.15, varColor('--accent-yellow'));
                }
            }

            // Draw Robot
            let rx = botState.x * size;
            let ry = botState.y * size;
            
            ctx.save();
            ctx.translate(rx + size/2, ry + size/2);
            ctx.rotate(botState.dir * Math.PI / 2);
            
            // body
            ctx.fillStyle = isCrash ? varColor('--accent-red') : varColor('--accent-mint');
            ctx.beginPath();
            ctx.roundRect(-size*0.3, -size*0.3, size*0.6, size*0.6, 8);
            ctx.fill();
            
            // eyes (facing North internally before rotation)
            ctx.fillStyle = varColor('--bg-dark');
            ctx.beginPath(); ctx.arc(-size*0.15, -size*0.1, size*0.08, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(size*0.15, -size*0.1, size*0.08, 0, Math.PI*2); ctx.fill();
            
            // direction indicator
            ctx.fillStyle = varColor('--accent-yellow');
            ctx.beginPath();
            ctx.moveTo(0, -size*0.4);
            ctx.lineTo(-size*0.1, -size*0.2);
            ctx.lineTo(size*0.1, -size*0.2);
            ctx.fill();

            if (isCrash) {
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(-20, -20); ctx.lineTo(20, 20); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(20, -20); ctx.lineTo(-20, 20); ctx.stroke();
            }

            ctx.restore();
        }

        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, color) {
            let rot = Math.PI / 2 * 3;
            let x = cx, y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;
                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function toggleTeacher() {
            const content = document.getElementById('teacher-content');
            const icon = document.getElementById('teacher-icon');
            const btn = document.getElementById('btn-teacher');
            const isOpen = content.classList.contains('open');
            
            if (isOpen) {
                content.classList.remove('open');
                icon.innerText = '▼';
                btn.setAttribute('aria-expanded', 'false');
            } else {
                content.classList.add('open');
                icon.innerText = '▲';
                btn.setAttribute('aria-expanded', 'true');
            }
        }

        // Start
        window.onload = init;

    </script>
</body>
</html>
